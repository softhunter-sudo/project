<!DOCTYPE html>
<html>
<head>
    <title>NetSentry Dashboard</title>
    <style>
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 30px;
        }
        h1 {
            color: #58a6ff;
            border-bottom: 2px solid #30363d;
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .status {
            font-size: 13px;
            color: #3fb950;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3fb950;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .alert-box {
            background: #3d1418;
            border: 1px solid #f85149;
            color: #f85149;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-weight: bold;
        }
        .stats-bar {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px 20px;
            flex: 1;
        }
        .stat-card .label {
            font-size: 12px;
            color: #8b949e;
            text-transform: uppercase;
        }
        .stat-card .value {
            font-size: 24px;
            color: #58a6ff;
            font-weight: bold;
            margin-top: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: #161b22;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            text-align: left;
            padding: 10px 15px;
            border-bottom: 1px solid #30363d;
        }
        th {
            color: #8b949e;
            text-transform: uppercase;
            font-size: 12px;
            background: #0d1117;
        }
        tr:hover {
            background: #1c2128;
        }
        .badge {
            background: #1f6feb;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-danger {
            background: #f85149;
        }
        .badge-warning {
            background: #d29922;
        }
    </style>
</head>
<body>
    <h1>
        🛡️ NetSentry — Live Traffic Monitor
        <span class="status"><span class="dot"></span> LIVE</span>
    </h1>

    <div class="stats-bar">
        <div class="stat-card">
            <div class="label">Active Source IPs</div>
            <div class="value" id="stat-ips">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Total Packets Seen</div>
            <div class="value" id="stat-packets">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Active Alerts</div>
            <div class="value" id="stat-alerts">0</div>
        </div>
    </div>

    <div id="alerts"></div>

    <table>
        <thead>
            <tr>
                <th>Source IP</th>
                <th>Unique Ports</th>
                <th>Packet Count</th>
                <th>Last Seen</th>
            </tr>
        </thead>
        <tbody id="traffic-table"></tbody>
    </table>

    <script>
        async function fetchTraffic() {
            const res = await fetch('/api/traffic');
            const data = await res.json();

            // Update stats bar
            document.getElementById('stat-ips').textContent = data.events.length;
            document.getElementById('stat-packets').textContent =
                data.events.reduce((sum, e) => sum + e.packet_count, 0);
            document.getElementById('stat-alerts').textContent = data.alerts.length;

            // Update alerts
            const alertsDiv = document.getElementById('alerts');
            alertsDiv.innerHTML = data.alerts.map(a => `<div class="alert-box">⚠️ ${a}</div>`).join('');

            // Update table
            const tableBody = document.getElementById('traffic-table');
            tableBody.innerHTML = data.events.map(e => {
                let badgeClass = '';
                if (e.unique_ports > 10) badgeClass = 'badge-danger';
                else if (e.unique_ports > 5) badgeClass = 'badge-warning';

                return `
                    <tr>
                        <td>${e.src_ip}</td>
                        <td><span class="badge ${badgeClass}">${e.unique_ports}</span></td>
                        <td>${e.packet_count}</td>
                        <td>${e.last_seen}</td>
                    </tr>
                `;
            }).join('');
        }

        setInterval(fetchTraffic, 1000);
        fetchTraffic();
    </script>
</body>
</html>
